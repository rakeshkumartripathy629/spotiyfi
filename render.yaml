services:
  - type: web
    name: sqotify-api
    runtime: node
    rootDir: server
    buildCommand: npm install && node src/download-ytdlp.mjs
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: true
        value: "mongodb+srv://user:Arak%404131@cluster0.6z5wylr.mongodb.net/bandhansutra?retryWrites=true&w=majority"
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: YOUTUBE_DL_SKIP_DOWNLOAD
        sync: true
        value: "true"

  - type: web
    name: sqotify-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
